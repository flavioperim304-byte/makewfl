<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supplier Lead Discovery</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 24px;
      max-width: 820px;
      margin: 0 auto;
      background: #f7f7f8;
      color: #111;
    }
    h1 { font-size: 22px; margin-bottom: 4px; }
    .subtitle { color: #666; font-size: 13px; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
    label .req { color: #d00; }
    label .hint { color: #888; font-weight: 400; font-size: 12px; }
    input, textarea, select {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      border: 1px solid #d0d0d5;
      border-radius: 6px;
      font-family: inherit;
      background: #fff;
    }
    textarea { min-height: 90px; resize: vertical; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: #2563eb; }
    button {
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status {
      margin-top: 16px;
      font-size: 14px;
      color: #666;
      min-height: 20px;
    }
    #status.error { color: #d00; }
    #status.success { color: #0a7d28; }
    .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Supplier Lead Discovery</h1>
    <p class="subtitle">Execute o agente de busca e enriquecimento de leads via Make.</p>

    <div class="form-group">
      <label for="hs_code">HS Code <span class="req">*</span></label>
      <input type="text" id="hs_code" placeholder="Ex: 330590" />
    </div>

    <div class="form-group">
      <label for="product">Product <span class="req">*</span></label>
      <input type="text" id="product" placeholder="Ex: Professional hair care products" />
    </div>

    <div class="form-group">
      <label for="country">Country <span class="req">*</span></label>
      <input type="text" id="country" placeholder="Ex: Chile" />
    </div>

    <div class="form-group">
      <label for="search_mode">Search Mode <span class="req">*</span></label>
      <select id="search_mode">
        <option value="deep" selected>Deep Search</option>
        <option value="standard">Standard Search</option>
      </select>
    </div>

    <div class="form-group">
      <label for="research_prompt">Search and enrichment request <span class="req">*</span></label>
      <textarea id="research_prompt" placeholder="Ex: Find manufacturers of professional hair care products in Chile with public contact details"></textarea>
    </div>

    <div class="form-group">
      <label for="scoring_prompt">Lead scoring request <span class="req">*</span></label>
      <textarea id="scoring_prompt" placeholder="Ex: Medium-sized importers/distributors in Chile, 50-500 employees, with public contact details"></textarea>
    </div>

    <div class="form-group">
      <label for="additional_queries">
        Additional queries <span class="hint">(opcional — uma por linha)</span>
      </label>
      <textarea id="additional_queries" placeholder="Ex:&#10;Find distributors in Chile&#10;Find importers in Chile"></textarea>
    </div>

    <button id="run">Execute agent</button>
    <div id="status"></div>
  </div>

  <script>
    const runBtn = document.getElementById('run');
    const statusEl = document.getElementById('status');

    function setStatus(msg, type) {
      statusEl.textContent = msg;
      statusEl.className = type || '';
    }

    runBtn.addEventListener('click', async () => {
      const additionalQueriesRaw = document.getElementById('additional_queries').value;
      const additional_queries = additionalQueriesRaw
        .split('\n')
        .map(q => q.trim())
        .filter(q => q.length > 0);

      const payload = {
        hs_code: document.getElementById('hs_code').value.trim(),
        product: document.getElementById('product').value.trim(),
        country: document.getElementById('country').value.trim(),
        search_mode: document.getElementById('search_mode').value,
        research_prompt: document.getElementById('research_prompt').value.trim(),
        scoring_prompt: document.getElementById('scoring_prompt').value.trim(),
        additional_queries: additional_queries
      };

      // Validação dos campos obrigatórios exigidos pelo Make
      const required = ['hs_code', 'product', 'country', 'search_mode', 'research_prompt', 'scoring_prompt'];
      const missing = required.filter(k => !payload[k]);
      if (missing.length) {
        setStatus('Preencha todos os campos obrigatórios: ' + missing.join(', '), 'error');
        return;
      }

      runBtn.disabled = true;
      setStatus('Enviando solicitação via Netlify... Aguarde o processamento no Google Sheets.', '');

      try {
        // Envia para a função serverless interna do Netlify
        const response = await fetch('/.netlify/functions/trigger-research', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (response.ok && result.success) {
          setStatus('Enviado com sucesso! O Make está a processar os dados na planilha.', 'success');
        } else {
          setStatus('Erro no envio: ' + (result.error || 'Falha ao processar requisição'), 'error');
        }
      } catch (e) {
        setStatus('Erro de rede ao conectar com o Netlify: ' + e.message, 'error');
      } finally {
        runBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
